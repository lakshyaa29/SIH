<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NagrikMitra AI — Your AI Guide to Government Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2038;
    --navy:#16324F;
    --navy-2:#1E4569;
    --paper:#F4F6F8;
    --paper-2:#FFFFFF;
    --line:#DCE3EA;
    --teal:#136C53;
    --teal-bg:#E6F3EE;
    --saffron:#B5651D;
    --saffron-bg:#FBEEE1;
    --red:#B23A3A;
    --red-bg:#FBEBEB;
    --muted:#5B6B7C;
    --token:#0F2038;
    --radius:14px;
    --shadow: 0 1px 2px rgba(15,32,56,0.06), 0 8px 24px rgba(15,32,56,0.06);
    --focus: 0 0 0 3px rgba(30,69,105,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Zilla Slab',Georgia,serif;
    font-weight:600;
    margin:0 0 .4em 0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  p{margin:0 0 1em 0;color:var(--muted);}
  a{color:var(--navy-2);}
  button{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .skip-link{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;z-index:999;border-radius:0 0 8px 0;}
  .skip-link:focus{left:0;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:none; box-shadow:var(--focus); border-radius:6px;
  }

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    background:var(--ink);
    color:#fff;
    font-size:12.5px;
    padding:6px 24px;
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .topbar .flag-strip{display:inline-flex; gap:3px; margin-right:8px;}
  .flag-strip span{width:14px;height:5px;border-radius:1px;display:inline-block;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .topbar select{
    background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:6px; padding:3px 6px; font-size:12px;
  }
  .topbar select option{color:#000;}

  nav.mainnav{
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50;
    box-shadow:0 1px 0 rgba(15,32,56,0.03);
  }
  .nav-inner{
    max-width:1180px; margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:0;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(155deg, var(--navy) 0%, var(--ink) 100%);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Zilla Slab',serif;font-weight:700;font-size:18px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.08);
  }
  .brand-text{text-align:left;}
  .brand-text .name{font-family:'Zilla Slab',serif;font-weight:700;font-size:18px;color:var(--ink);line-height:1.1;}
  .brand-text .tag{font-size:11px;color:var(--muted);letter-spacing:.02em;}
  .navlinks{display:flex;gap:4px;flex-wrap:wrap;}
  .navlinks button{
    background:none;border:none;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--navy);cursor:pointer;
  }
  .navlinks button:hover{background:var(--paper);}
  .navlinks button.active{background:var(--ink);color:#fff;}

  main{flex:1;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  .section{padding:52px 0;}
  .section.tight{padding:32px 0;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    padding:11px 20px;border-radius:10px;font-weight:600;font-size:14.5px;
    border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--navy);}
  .btn-outline{background:#fff;color:var(--ink);border-color:var(--line);}
  .btn-outline:hover{border-color:var(--navy-2);}
  .btn-saffron{background:var(--saffron);color:#fff;}
  .btn-saffron:hover{filter:brightness(1.05);}
  .btn-ghost{background:none;color:var(--navy-2);padding:8px 10px;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-block{width:100%;}

  /* ---------- Hero ---------- */
  .hero{
    background:
      radial-gradient(1100px 420px at 85% -10%, rgba(181,101,29,0.10), transparent 60%),
      radial-gradient(900px 400px at -10% 0%, rgba(19,108,83,0.08), transparent 60%),
      linear-gradient(180deg, #0F2038 0%, #16324F 100%);
    color:#fff;
    padding:64px 0 56px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(700px 300px at 30% 20%, black, transparent);
    pointer-events:none;
  }
  .hero-inner{position:relative;max-width:820px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:#F1E4D4;margin-bottom:18px;
  }
  .hero h1{color:#fff;font-size:clamp(30px,4.4vw,46px);line-height:1.08;max-width:16ch;}
  .hero .sub{color:#C9D5E0;font-size:17px;max-width:56ch;margin-top:14px;}
  .ask-box{
    margin-top:30px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.35);
    display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;
  }
  .ask-box textarea{
    flex:1;min-width:220px;border:none;outline:none;resize:none;padding:14px 14px;font-size:15.5px;font-family:inherit;color:var(--ink);min-height:52px;max-height:140px;
  }
  .ask-box .btn{margin:6px;white-space:nowrap;}
  .hero-hint{margin-top:12px;font-size:13px;color:#9FB2C4;}
  .hero-hint button{background:none;border:none;color:#F1E4D4;text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .hero-stats{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;}
  .hero-stats .stat b{display:block;font-family:'Zilla Slab',serif;font-size:22px;color:#fff;}
  .hero-stats .stat span{font-size:12px;color:#9FB2C4;}

  /* Token strip - signature motif */
  .token-chip{
    display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);
    border-radius:10px;padding:8px 12px;font-size:12.5px;color:#E9EEF3;margin-top:22px;
  }
  .token-chip b{font-family:'IBM Plex Mono',monospace;color:#F1E4D4;}

  /* ---------- Cards / grids ---------- */
  .grid{display:grid;gap:18px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:920px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr;}}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  }
  .card h3{font-size:17px;}
  .card .desc{font-size:13.5px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
  }
  .pill-teal{background:var(--teal-bg);color:var(--teal);}
  .pill-saffron{background:var(--saffron-bg);color:var(--saffron);}
  .pill-red{background:var(--red-bg);color:var(--red);}
  .pill-muted{background:var(--paper);color:var(--muted);border:1px solid var(--line);}

  .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .section-head .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--saffron);margin-bottom:6px;display:block;}
  .section-head h2{font-size:26px;}

  .service-card{cursor:pointer;transition:border-color .12s ease, transform .12s ease;}
  .service-card:hover{border-color:var(--navy-2);transform:translateY(-2px);}
  .service-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .service-card .cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}

  /* how it works */
  .steps-row{display:flex;gap:0;counter-reset:step;}
  .step-item{flex:1;position:relative;padding:0 16px 0 0;}
  .step-item .num{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--saffron);font-weight:700;margin-bottom:8px;display:block;
  }
  .step-item h4{font-size:15.5px;margin-bottom:6px;}
  .step-item p{font-size:13.5px;}
  @media(max-width:800px){.steps-row{flex-direction:column;gap:20px;}}

  footer{background:var(--ink);color:#B9C6D3;padding:40px 0 24px;margin-top:40px;font-size:13.5px;}
  footer h4{color:#fff;font-size:14px;}
  footer a{color:#B9C6D3;text-decoration:none;}
  footer a:hover{color:#fff;}
  .foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px;}
  @media(max-width:800px){.foot-grid{grid-template-columns:1fr 1fr;}}
  .disclaimer{
    margin-top:28px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:12.5px;color:#9FB2C4;background:rgba(255,255,255,.03);
  }

  /* ---------- Assistant ---------- */
  .assistant-shell{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;}
  @media(max-width:900px){.assistant-shell{grid-template-columns:1fr;}}
  .chat-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:420px;display:flex;flex-direction:column;}
  .chat-log{padding:22px;flex:1;display:flex;flex-direction:column;gap:14px;max-height:560px;overflow-y:auto;}
  .msg{max-width:80%;padding:12px 15px;border-radius:12px;font-size:14.5px;line-height:1.5;}
  .msg.ai{background:var(--paper);color:var(--ink);align-self:flex-start;border:1px solid var(--line);}
  .msg.user{background:var(--ink);color:#fff;align-self:flex-end;}
  .msg.system{align-self:center;background:var(--saffron-bg);color:var(--saffron);font-size:12.5px;padding:6px 12px;border-radius:999px;}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:12px 15px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.1s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:.9;}}

  .qopts{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:90%;}
  .qopts button{
    background:#fff;border:1.5px solid var(--navy-2);color:var(--navy-2);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .qopts button:hover{background:var(--navy-2);color:#fff;}

  .chat-input-row{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;}
  .chat-input-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14.5px;font-family:inherit;outline:none;
  }
  .chat-input-row input:focus{border-color:var(--navy-2);}

  .side-panel .card{margin-bottom:16px;}
  .intent-badge{display:flex;align-items:center;gap:10px;}
  .intent-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);}
  .progress-track{height:6px;background:var(--paper);border-radius:99px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .25s ease;}

  .demo-list button{
    display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);margin-bottom:8px;cursor:pointer;
  }
  .demo-list button:hover{border-color:var(--navy-2);}

  /* ---------- Result page ---------- */
  .result-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
  .match-ring{
    width:86px;height:86px;border-radius:50%;
    background:conic-gradient(var(--teal) calc(var(--pct,80)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .match-ring .inner{width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .match-ring .inner b{font-family:'Zilla Slab',serif;font-size:17px;}
  .match-ring .inner span{font-size:9.5px;color:var(--muted);}

  .checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .checklist li{display:flex;gap:10px;font-size:14px;color:var(--ink);align-items:flex-start;}
  .checklist li .tick{color:var(--teal);font-weight:700;flex-shrink:0;}
  .doclist{display:flex;flex-wrap:wrap;gap:8px;}
  .doclist span{background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:13px;}

  .actionplan{list-style:none;margin:0;padding:0;counter-reset:ap;}
  .actionplan li{
    display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);
  }
  .actionplan li:last-child{border-bottom:none;}
  .actionplan .apnum{
    width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;flex-shrink:0;
  }
  .actionplan h4{font-size:14.5px;margin-bottom:3px;}
  .actionplan p{font-size:13px;margin:0;}

  .why-box{background:var(--teal-bg);border:1px solid #cfe6dc;border-radius:12px;padding:16px 18px;}
  .why-box h4{color:var(--teal);font-size:14px;margin-bottom:8px;}

  .source-box{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex-wrap:wrap;gap:10px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;}
  tr:last-child td{border-bottom:none;}

  /* forms */
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;}
  input[type=text],input[type=search],input[type=date],select,textarea.field{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;
  }
  input[type=text]:focus,select:focus,textarea.field:focus{border-color:var(--navy-2);}
  .field-row{margin-bottom:14px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .icon{font-size:34px;margin-bottom:10px;}

  .badge-inline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
  .kbd{font-family:'IBM Plex Mono',monospace;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;}

  .tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
  .tabbar button{background:none;border:none;padding:10px 4px;margin-right:18px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tabbar button.active{color:var(--ink);border-bottom-color:var(--saffron);}

  .qa-item{border-bottom:1px solid var(--line);padding:16px 0;}
  .qa-item h4{font-size:15px;color:var(--navy);margin-bottom:6px;}
  .qa-item p{font-size:14px;margin:0;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c7d1da;border-radius:99px;}

  @media(prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>

<script>
/* =========================================================================
   NAGRIKMITRA AI — PROTOTYPE
   Single-file client-side implementation of the RAG-style flow described
   in the project brief:

   User Question -> Intent Detection -> Follow-up Questions -> User Profile
   -> retrieveRelevantServices() [Government Service Retrieval]
   -> generateGroundedResponse() [Grounded Answer + Confidence]
   -> Official Sources -> Personalized Action Plan

   NOTE ON ARCHITECTURE (read this first):
   This prototype runs entirely in the browser (no Node/Express/SQLite
   server) so it is 100% clickable the moment you open this file — no
   npm install, no backend, no API key required. The functions below
   are written as the same abstractions a real backend would expose
   (retrieveRelevantServices, generateGroundedResponse, an "API" object
   that mimics REST calls) so this logic can be lifted almost as-is into
   an Express + SQLite backend later. See README.md for the upgrade path.

   All "AI" behaviour here is a transparent, rule-based demo/mock layer —
   never a live LLM or a live government API. This is stated on-screen
   wherever relevant, per the brief's anti-hallucination requirements.
   ========================================================================= */

/* ---------------------------- 1. DATA LAYER ---------------------------- */

// Government service / scheme records. Official URLs point to real,
// well-known government domains. Where a scheme is state-administered,
// "states" is ['All'] and the citizen is told to confirm state-specific
// steps on the linked portal.
const SERVICES = [
  {
    id:'nsp-scholarship', service_name:'National Scholarship Portal (NSP)', category:'Education',
    description:'Single-window portal that hosts hundreds of central and state government scholarships for school, undergraduate, postgraduate and PhD students.',
    states:['All'],
    eligibility:['Enrolled student (school/UG/PG/PhD)','Meets the specific scheme\'s income/category criteria on NSP','Valid Aadhaar-linked bank account'],
    required_documents:['Aadhaar card','Bank passbook (Aadhaar-linked)','Latest mark sheet / admission proof','Income certificate (for income-based schemes)','Category certificate (if applicable)'],
    application_steps:['Register on scholarships.gov.in as a fresh applicant','Fill personal, academic and bank details','Select the scholarship scheme(s) you are eligible for','Upload required documents','Submit and note your Application ID for tracking'],
    official_url:'https://scholarships.gov.in', source_name:'Ministry of Education — National Scholarship Portal',
    last_verified:'2026-06-01', confidence:'High',
    keywords:['scholarship','student','education','study','college','fee','tuition','financial help education','stipend']
  },
  {
    id:'pm-kisan', service_name:'PM-KISAN (Pradhan Mantri Kisan Samman Nidhi)', category:'Farmer Services',
    description:'Direct income support of ₹6,000/year to eligible landholding farmer families, paid in three instalments straight to bank accounts.',
    states:['All'],
    eligibility:['Landholding farmer family (as per state land records)','Excludes certain categories: government employees, income-tax payers, professionals — check full exclusion list on the portal'],
    required_documents:['Aadhaar card','Land ownership records','Bank account details','Mobile number linked to Aadhaar'],
    application_steps:['Visit the PM-KISAN portal or your local Common Service Centre (CSC)','Complete "New Farmer Registration" with land and bank details','Get land records verified by the local revenue/agriculture officer','Track status using your Aadhaar number on the portal'],
    official_url:'https://pmkisan.gov.in', source_name:'Ministry of Agriculture & Farmers Welfare — PM-KISAN',
    last_verified:'2026-06-01', confidence:'High',
    keywords:['farmer','farming','crop','kisan','agriculture','land','cultivator','income support farmer']
  },
  {
    id:'pmjay', service_name:'Ayushman Bharat — PM-JAY', category:'Healthcare',
    description:'Health insurance cover of up to ₹5 lakh per family per year for secondary and tertiary hospitalisation at empanelled hospitals.',
    states:['All'],
    eligibility:['Family listed as eligible under SECC deprivation criteria / state extension','No cap on family size or age under the scheme'],
    required_documents:['Aadhaar card','Ration card / family ID','Any state-notified eligibility proof'],
    application_steps:['Check eligibility on the PM-JAY portal or the "Am I Eligible" tool','Visit the nearest empanelled hospital\'s Ayushman Bharat help desk with ID proof','Get your Ayushman card (PVC card) generated','Use the card for cashless treatment at empanelled hospitals'],
    official_url:'https://pmjay.gov.in', source_name:'National Health Authority — PM-JAY',
    last_verified:'2026-06-01', confidence:'High',
    keywords:['health','hospital','medical','treatment','insurance','ayushman','surgery cost','healthcare assistance']
  },
  {
    id:'uidai-aadhaar', service_name:'Aadhaar Enrolment & Update Services', category:'Aadhaar',
    description:'Enrol for a new Aadhaar number or update demographic/biometric details through UIDAI\'s official channels.',

// Rule-based intent detector — scores each intent by keyword occurrence.
function detectIntent(text){
  const t = (' '+text.toLowerCase()+' ');
  let best = {key:null, score:0, label:null};
  INTENTS.forEach(intent=>{
    let score = 0;
    intent.keywords.forEach(k=>{ if(t.includes(k.toLowerCase())) score += (k.split(' ').length>1?2:1); });
    if(score > best.score) best = {key:intent.key, score, label:intent.label};
  });
  if(best.score===0) return {key:null,label:'Other / Unclear', confidence:0};
  const confidence = Math.min(96, 55 + best.score*10);
  return {key:best.key, label:best.label, confidence};
}

// Government Service Retrieval — the "R" in RAG.
function retrieveRelevantServices(intentKey, answers, sourceList){
  const pool = (sourceList||SERVICES);
  let candidates = pool.filter(s => s.category===intentKey);
  if(candidates.length===0){
    // fallback: keyword match against free text answers
    candidates = pool;
  }
  const scored = candidates.map(s=>{
    let score = 40; // base score for category match
    const ans = Object.values(answers||{}).join(' ').toLowerCase();
    s.keywords.forEach(k=>{ if(ans.includes(k.toLowerCase())) score += 8; });
    if(answers && answers.income){
      if(answers.income.includes('Below') || answers.income.includes('1–2.5')) score += 10;
    }
    if(answers && answers.existing==='No') score += 6;
    if(answers && answers.land && answers.land.startsWith('Yes')) score += 10;
    score = Math.min(97, score);
    return {service:s, score};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,3);
}

function confidenceLabel(score){
  if(score>=80) return 'High';
  if(score>=60) return 'Medium';
  return 'Low';
}

// Grounded response generator — the "G" in RAG. Builds explanation text
// strictly from the retrieved service record + collected answers; never
// invents new facts.
function generateGroundedResponse(service, answers){
  const why = [];
  if(answers.state) why.push('You are located in '+answers.state+(service.states.includes('All')?' (scheme applies nationwide)':''));
  if(answers.level) why.push('Matches your education level: '+answers.level);
  if(answers.income) why.push('Income bracket considered: '+answers.income);
  if(answers.employment) why.push('Employment status considered: '+answers.employment);
  if(answers.land) why.push('Land ownership status: '+answers.land);
  if(answers.assist) why.push('Type of assistance requested: '+answers.assist);
  if(why.length===0) why.push('Matched based on the category of your request: '+service.category);
  return why;
}

function scrollChatToBottom(){
  const el = document.getElementById('chatLog');
  if(el) el.scrollTop = el.scrollHeight;
}

function handleChatSubmit(){
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if(!val){ shakeInput(); return; }
  input.value='';
  sendMessage(val);
}

function shakeInput(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  input.style.borderColor = 'var(--red)';
  input.placeholder = 'Please type something before sending…';
  setTimeout(()=>{ input.style.borderColor=''; }, 900);
}

function sendMessage(text){
  const c = state.chat;
  pushMsg({type:'user', text});

  if(c.awaitingFreeText){
    // treat as answer to an "Other" state or free text follow-up (rare path)
    c.awaitingFreeText = false;
  }

  if(!c.intent){
    const result = detectIntent(text);
    if(!result.key){
      renderThinking(()=>{
        pushMsg({type:'ai', text:`I couldn't confidently identify a suitable government service from that description. Please try rephrasing, or browse services directly.`});
        pushMsg({type:'ai', text:`You can also try one of the Demo Mode examples on the right →`});
        render(); scrollChatToBottom();
      });
      return;
    }
    c.intent = result.key;
    c.confidence = result.confidence;
    c.pendingQuestions = (QUESTIONS[result.key] || QUESTIONS['__default']).slice();
    c.totalQuestions = c.pendingQuestions.length;
    c.askedCount = 0;
    renderThinking(()=>{
      pushMsg({type:'system', text:`Detected Intent: ${result.label}`});
      askNextQuestion();
    });
    return;
  }
  // Free-text sent while questions pending — nudge toward buttons
  if(c.pendingQuestions.length>0){
    renderThinking(()=>{
      pushMsg({type:'ai', text:`Please pick one of the options above so I can match you accurately — or click "Start Again" to describe a different problem.`});
      render(); scrollChatToBottom();
    });
  }
}
window.sendMessage = sendMessage;

function askNextQuestion(){
  const c = state.chat;
  render(); scrollChatToBottom();
  if(c.pendingQuestions.length===0){
    finishAssistant();
    return;
  }
  const q = c.pendingQuestions[0];
  pushMsg({type:'ai', text:q.label});
  pushMsg({type:'options', qid:q.id, options:q.options});
  render(); scrollChatToBottom();
}

function answerQuestion(qid, value){
  const c = state.chat;
  c.answers[qid] = value;
  pushMsg({type:'user', text:value});
  c.pendingQuestions.shift();
  c.askedCount++;
  renderThinking(()=>{ askNextQuestion(); }, 500);
}
window.answerQuestion = answerQuestion;

function renderThinking(cb, delay){
  const c = state.chat;
  pushMsg({type:'ai', text:'<span class="typing"><span></span><span></span><span></span></span>'});
  render(); scrollChatToBottom();
  setTimeout(()=>{
    c.log.pop(); // remove typing indicator
    cb();
  }, delay || 550);
}

function finishAssistant(){
  const c = state.chat;
  const stages = ['Understanding your request…','Finding relevant government services…','Checking available information…'];
  let i=0;
  function step(){
    pushMsg({type:'ai', text:`<span class="typing"><span></span><span></span><span></span></span> <span style="font-size:12px;color:var(--muted);">${stages[i]}</span>`});
    render(); scrollChatToBottom();
    setTimeout(()=>{
      c.log.pop();
      i++;
      if(i<stages.length){ step(); }
      else{
        const matches = retrieveRelevantServices(c.intent, c.answers, state.adminServices);
        c.resultServices = matches;
        pushMsg({type:'ai', text:`Here's what I found. Opening your personalised result…`});
        render(); scrollChatToBottom();
        setTimeout(()=>{ navigate('results'); }, 600);
      }
    }, 550);
  }
  step();
}

function resetAssistant(){
  state.chat = { log:[], intent:null, confidence:0, answers:{}, pendingQuestions:[], askedCount:0, totalQuestions:0, awaitingFreeText:false, resultServices:null, demoRunning:false };
  render();
}
window.resetAssistant = resetAssistant;

function runDemo(query){
  resetAssistant();
  state.chat.demoRunning = true;
  render();
  setTimeout(()=>{ sendMessage(query); }, 300);
  // release the "demo running" lock once we land on results (checked in finishAssistant chain)
  const check = setInterval(()=>{
    if(state.view==='results'){ state.chat.demoRunning=false; clearInterval(check); }
  }, 400);
}

    </div>
  </section>`;
}

function actionPlanSteps(s){
  return [
    {title:'Check eligibility', desc:'Compare your situation against: '+s.eligibility[0]},
    {title:'Prepare required documents', desc:'Gather: '+s.required_documents.slice(0,3).join(', ')+(s.required_documents.length>3?', and more.':'.')},
    {title:'Open the official application portal', desc:'Use the verified link above — '+s.official_url.replace('https://','')},
    {title:'Submit your application', desc: s.application_steps[Math.min(2,s.application_steps.length-1)] },
    {title:'Track your application', desc:'Save this service to your dashboard so you can follow up and update its status.'}
  ];
}

function scrollToDocs(){ /* documents are inline; smooth-scroll no-op if already visible */ }
window.scrollToDocs = scrollToDocs;

function selectAlt(id){
  const s = SERVICES.find(x=>x.id===id) || state.adminServices.find(x=>x.id===id);
  if(!s) return;
  state.chat.resultServices = [{service:s, score: state.chat.resultServices.find(m=>m.service.id===id)?.score || 75}, ...state.chat.resultServices.filter(m=>m.service.id!==id)];
  render();
}
window.selectAlt = selectAlt;

function toggleSave(id){
  const s = SERVICES.find(x=>x.id===id);
  const idx = state.saved.indexOf(id);
  if(idx>-1){ state.saved.splice(idx,1); }
  else{
    state.saved.push(id);
    state.history.unshift({id:uid(), service_name:s.service_name, status:'Saved', ts:new Date().toLocaleString()});
  }
  render();
}
window.toggleSave = toggleSave;

/* ---------------------------- SERVICES VIEW ------------------------------- */

function servicesView(){
  const q = state.search.toLowerCase();
  const cats = ['All', ...new Set(SERVICES.map(s=>s.category))];
  const filtered = SERVICES.filter(s=>{
    if(!q) return true;
    return (s.service_name+' '+s.description+' '+s.keywords.join(' ')).toLowerCase().includes(q);
  });
  return `
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div><span class="kicker">Directory</span><h2>Browse government services</h2></div>
      </div>
      <div style="margin-bottom:24px;max-width:480px;">
        <label for="svcsearch">Search services</label>
        <input id="svcsearch" type="search" placeholder="Try “scholarship”, “farmer”, “pension”, “certificate”…" value="${state.search}" oninput="onSearch(this.value)"/>
      </div>
      <div class="grid grid-3">
        ${filtered.length? filtered.map(s=>serviceCardFull(s)).join('') : `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div><p>No services match “${state.search}”. Try a different keyword.</p></div>`}
      </div>
    </div>
  </section>`;
}

function serviceCardFull(s){
  return `
  <div class="card service-card" onclick="openServiceQuick('${s.id}')">
    <div class="top">
      <span class="cat">${s.category}</span>
      <span class="pill pill-${s.confidence==='High'?'teal':s.confidence==='Medium'?'saffron':'red'}">${s.confidence}</span>
    </div>
    <h3>${s.service_name}</h3>
    <p class="desc">${s.description}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <span style="font-size:12px;color:var(--muted);">Last verified ${s.last_verified}</span>
      <span class="btn btn-sm btn-ghost">View →</span>
    </div>
  </div>`;
}

function onSearch(v){ state.search = v; render(); document.getElementById('svcsearch').focus(); document.getElementById('svcsearch').value=v; }
window.onSearch = onSearch;

/* --------------------------- DASHBOARD VIEW ------------------------------- */

  return `
  <section class="section">
    <div class="wrap">
      <div class="section-head"><div><span class="kicker">My Government Services</span><h2>Your dashboard</h2></div></div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="font-size:15px;">Saved & researched services</h3>
        ${savedSvcs.length? `
        <table>
          <thead><tr><th>Service</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${savedSvcs.map(s=>`<tr>
              <td>${s.service_name}</td>
              <td><span class="pill pill-teal">Saved</span></td>
              <td><button class="btn btn-sm btn-outline" onclick="openServiceQuick('${s.id}')">View</button></td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-state" style="padding:30px 0;"><div class="icon">📌</div><p>No saved services yet. Save a recommendation to track it here.</p></div>`}

        <h3 style="font-size:15px;">Recent activity</h3>
        ${state.history.length? `
        <table>
          <thead><tr><th>Service</th><th>Status</th><th>When</th></tr></thead>
          <tbody>
            ${state.history.map(h=>`<tr><td>${h.service_name}</td><td><span class="pill pill-muted">${h.status}</span></td><td style="color:var(--muted);">${h.ts}</td></tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-state" style="padding:30px 0;"><div class="icon">🕒</div><p>No activity yet this session.</p></div>`}
        <p style="font-size:12px;margin-top:12px;">Note: this prototype keeps dashboard data in-browser for the current session only (no backend database yet) — see README for the upgrade path to persistent storage.</p>

/* --------------------------- PLATFORMS VIEW -------------------------------- */

function platformsView(){
  return `
  <section class="section">
    <div class="wrap">
      <div class="section-head"><div><span class="kicker">Official platforms</span><h2>Trusted government platforms</h2></div></div>
      <div class="grid grid-3">

            <p style="font-size:12px;color:var(--muted);">Source: ${p.source}</p>

          </div>`).join('')}
      </div>
    </div>
  </section>`;
}

/* --------------------------- GRIEVANCE VIEW -------------------------------- */

function grievanceView(){
  const g = state.grievance;
  return `
  <section class="section">
    <div class="wrap" style="max-width:760px;">
      <div class="section-head"><div><span class="kicker">Grievance help</span><h2>Something not working as it should?</h2></div></div>
      <div class="card">
        <label for="grtext">Describe what's happened</label>
        <textarea id="grtext" class="field" rows="3" placeholder="e.g. My government application has been pending for 30 days."></textarea>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="analyzeGrievance()">Analyse</button>

        ${g.stage==='result' ? `
        <div style="margin-top:24px;">
          <div class="pill pill-saffron" style="margin-bottom:14px;">Intent: Government Grievance</div>
          <div class="why-box" style="margin-bottom:18px;">
            <h4>Possible next steps</h4>
            <ul class="checklist">
              <li><span class="tick">✓</span>Check your application/reference number status on the relevant department's own portal first</li>
              <li><span class="tick">✓</span>If unresolved beyond the stated turnaround time, file a formal grievance on CPGRAMS</li>
              <li><span class="tick">✓</span>Keep your reference/application ID and any communication ready before filing</li>
            </ul>
          </div>
          <div class="source-box">
            <div>
              <div class="badge-inline" style="color:var(--teal);">✓ Verified Government Source</div>
              <p style="margin:2px 0 0;font-size:13px;">CPGRAMS — Department of Administrative Reforms & Public Grievances</p>
            </div>
            <a class="btn btn-primary" href="https://pgportal.gov.in" target="_blank" rel="noopener">Open Official Grievance Portal ↗</a>

function analyzeGrievance(){
  const text = document.getElementById('grtext').value.trim();
  if(!text){ return; }
  state.grievance.stage='result';
  render();
}
window.analyzeGrievance = analyzeGrievance;

/* ----------------------------- ADMIN VIEW ---------------------------------- */

function adminView(){
  return `
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div><span class="kicker">Data management (demo)</span><h2>Admin dashboard</h2></div>
        <button class="btn btn-primary" onclick="openAdminForm()">+ Add service</button>
      </div>
      <p style="font-size:13px;margin-top:-10px;">No production authentication in this prototype — for hackathon demo purposes only, as noted in the brief.</p>
      <div id="adminFormWrap"></div>
      <div class="card">
        <table>
          <thead><tr><th>Service</th><th>Category</th><th>Confidence</th><th>Last verified</th><th>Actions</th></tr></thead>
          <tbody>
            ${state.adminServices.map(s=>`
            <tr>
              <td>${s.service_name}</td>
              <td>${s.category}</td>
              <td><span class="pill pill-${s.confidence==='High'?'teal':s.confidence==='Medium'?'saffron':'red'}">${s.confidence}</span></td>
              <td>${s.last_verified}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-sm btn-outline" onclick="markVerified('${s.id}')">Mark verified</button>
                <button class="btn btn-sm btn-outline" onclick="editAdminService('${s.id}')">Edit</button>
                <button class="btn btn-sm btn-outline" style="color:var(--red);border-color:#f0c9c9;" onclick="deleteAdminService('${s.id}')">Delete</button>

          </tbody>
        </table>
      </div>

}

function markVerified(id){
  const s = state.adminServices.find(x=>x.id===id);
  if(s){ s.last_verified = todayStr(); render(); }
}
window.markVerified = markVerified;

function deleteAdminService(id){
  state.adminServices = state.adminServices.filter(x=>x.id!==id);
  render();
}
window.deleteAdminService = deleteAdminService;

let adminEditingId = null;
function openAdminForm(existing){
  adminEditingId = existing ? existing.id : null;
  const s = existing || {service_name:'',category:'',description:'',official_url:'',source_name:'',confidence:'Medium'};
  document.getElementById('adminFormWrap').innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <h3 style="font-size:15px;">${existing? 'Edit service' : 'Add new service'}</h3>
      <div class="grid grid-2">
        <div class="field-row"><label>Service name</label><input id="af_name" type="text" value="${s.service_name}"/></div>
        <div class="field-row"><label>Category</label><input id="af_cat" type="text" value="${s.category}"/></div>
      </div>
      <div class="field-row"><label>Description</label><input id="af_desc" type="text" value="${s.description}"/></div>
      <div class="grid grid-2">
        <div class="field-row"><label>Official URL</label><input id="af_url" type="text" value="${s.official_url}"/></div>
        <div class="field-row"><label>Source name</label><input id="af_src" type="text" value="${s.source_name}"/></div>
      </div>
      <div class="field-row" style="max-width:200px;">
        <label>Confidence</label>
        <select id="af_conf"><option ${s.confidence==='High'?'selected':''}>High</option><option ${s.confidence==='Medium'?'selected':''}>Medium</option><option ${s.confidence==='Low'?'selected':''}>Low</option></select>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="saveAdminService()">Save</button>
        <button class="btn btn-outline" onclick="document.getElementById('adminFormWrap').innerHTML=''">Cancel</button>
      </div>
    </div>`;
}
window.openAdminForm = openAdminForm;

function editAdminService(id){
  const s = state.adminServices.find(x=>x.id===id);
  openAdminForm(s);
}
window.editAdminService = editAdminService;

function saveAdminService(){
  const vals = {
    service_name: document.getElementById('af_name').value.trim(),
    category: document.getElementById('af_cat').value.trim(),
    description: document.getElementById('af_desc').value.trim(),
    official_url: document.getElementById('af_url').value.trim(),
    source_name: document.getElementById('af_src').value.trim(),
    confidence: document.getElementById('af_conf').value
  };
  if(!vals.service_name || !vals.official_url){ alert('Service name and Official URL are required.'); return; }
  if(adminEditingId){
    const s = state.adminServices.find(x=>x.id===adminEditingId);
    Object.assign(s, vals);
  } else {
    state.adminServices.push(Object.assign({
      id:'svc-'+uid(), states:['All'], eligibility:[], required_documents:[], application_steps:[],
      last_verified: todayStr(), keywords:[vals.service_name.toLowerCase()]
    }, vals));
  }
  document.getElementById('adminFormWrap').innerHTML='';
  render();
}
window.saveAdminService = saveAdminService;

  if(hero){
    hero.addEventListener('keydown', e=>{

}
